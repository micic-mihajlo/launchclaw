# OpenClaw Gateway — Nginx Reverse Proxy
# Managed by LaunchClaw — do not edit manually

upstream openclaw_gateway {
    server 127.0.0.1:__GATEWAY_PORT__;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/openclaw-access.log;
    error_log /var/log/nginx/openclaw-error.log;

    # Max upload size
    client_max_body_size 50m;

    # Gateway proxy
    location / {
        proxy_pass http://openclaw_gateway;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint (no logging)
    location /health {
        proxy_pass http://openclaw_gateway/health;
        access_log off;
    }

    # Block access to sensitive paths
    location ~ /\. {
        deny all;
        return 404;
    }
}
